<form action="/genera_excel" method="POST">
    <label for="casa">Squadra di Casa:</label>
    <select name="squadra_casa" id="casa" required>
        <option value="" disabled selected>Seleziona una squadra</option>
        {% for squadra in squadre %}
            <option value="{{ squadra }}">{{ squadra }}</option>
        {% endfor %}
    </select>

    <label for="ospite">Squadra Ospite:</label>
    <select name="squadra_ospite" id="ospite" required>
        <option value="" disabled selected>Seleziona una squadra</option>
        {% for squadra in squadre %}
            <option value="{{ squadra }}">{{ squadra }}</option>
        {% endfor %}
    </select>

    <button type="submit">Genera Excel</button>
</form>
