<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Seleziona App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Contenitore principale -->
  <div class="content">

    <!-- Sezione di benvenuto con testo sopra -->
    <div class="mb-4">
      <h1>Benvenuto nel sistema di gestione per manifestazioni FITP (not official)</h1>
      <p class="lead">
        Scegli quale applicazione usare:
      </p>
    </div>

    <!-- Menù App -->
    <div class="btn-group mb-3">
      <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        Seleziona App
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#" onclick="selezionaApp('app1')">File torneo tennis</a></li>
        <li><a class="dropdown-item" href="#" onclick="selezionaApp('app2')">File torneo beach tennis</a></li>
      </ul>
    </div>

    <!-- Selezione competizione, solo per App 2 -->
    <div id="competizione" style="display: none;" class="mb-3">
      <h4>Seleziona tipo di competizione:</h4>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="selezionaCompetizione('singolare')">Singolare</button>
        <button type="button" class="btn btn-secondary" onclick="selezionaCompetizione('doppio')">Doppio</button>
      </div>
    </div>

    <!-- Pulsante continua -->
    <div>
      <a id="prosegui" href="#" class="btn btn-success" style="display: none;">Continua</a>
    </div>

  </div>

  <script>
    let appSelezionata = '';
    let tipoCompetizione = '';

    function selezionaApp(app) {
      appSelezionata = app;
      tipoCompetizione = ''; // reset competizione

      if (app === 'app2') {
        document.getElementById('competizione').style.display = 'block';
        document.getElementById('prosegui').style.display = 'none';
      } else {
        document.getElementById('competizione').style.display = 'none';
        document.getElementById('prosegui').href = '/upload?app=' + app;
        document.getElementById('prosegui').style.display = 'inline-block';
      }
    }

    function selezionaCompetizione(tipo) {
      tipoCompetizione = tipo;
      document.getElementById('prosegui').href = '/upload?app=' + appSelezionata + '&competizione=' + tipoCompetizione;
      document.getElementById('prosegui').style.display = 'inline-block';
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
