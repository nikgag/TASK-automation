name: Release Windows

on:
  push:
    tags: ["v*"]          # parte solo col push di un tag tipo v1.2.0
  workflow_dispatch:      # prova manuale: costruisce ma NON pubblica

permissions:
  contents: write         # serve a creare la Release

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # la stessa che usi tu
          cache: pip
      - name: Librerie e PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Exe (PyInstaller)
        env:
          TASK_SENZA_CSV: "1"
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build strumenti/task.spec
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-prova" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersione=$v" strumenti\task_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallito" }
      - uses: actions/upload-artifact@v4
        with:
          name: TASK-Setup
          path: dist/TASK-Setup.exe
      - name: Pubblica la Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/TASK-Setup.exe --title "TASK ${{ github.ref_name }}" --generate-notes